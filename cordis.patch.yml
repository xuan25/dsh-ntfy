# dsh-ntfy: cordis bundle patch that registers the plugin in the profile.
# The base configuration is the NTFY_* env contract (see README); higher patch
# layers may override it via `config` on this id. The bundle carries no config
# values of its own, so config is empty.
- insert:
    - id: dsh-ntfy
      name: 'dsh-ntfy'
      config: {}
